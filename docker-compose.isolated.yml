# Compose de produção na VM (restrições duras; TLS e dados em /data).
# Caddy (contêiner ou host) entra na rede `crptochat` e encaminha:
#   - TCP/TLS :7777 → cliente de terminal
#   - wss /ws → ws://crptochat:7778 (WebGate sem TLS na rede Docker)
#   - estático de web/dist em /web/ (a raiz continua a página de downloads)
# Ver packaging/DEPLOY.md
services:
  server:
    build: .
    image: crptochat-server
    container_name: crptochat
    user: crpto
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 256
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    volumes:
      - crptochat-data:/data
    ports:
      - "7777:7777"
    networks:
      - crptochat
    entrypoint: ["python", "-u", "-m", "crptochat.server"]
    command:
      - --data
      - /data
      - --ws-host
      - 0.0.0.0
      - --ws-port
      - "7778"
      - --ws-behind-proxy
      - --ws-trusted-proxy
      - 172.16.0.0/12
      - --ws-trusted-proxy
      - 10.0.0.0/8
      - --ws-trusted-proxy
      - 192.168.0.0/16
      - --ws-origin
      - https://crptochat.acpt.app.br
    restart: unless-stopped

networks:
  crptochat:
    name: crptochat

volumes:
  crptochat-data: