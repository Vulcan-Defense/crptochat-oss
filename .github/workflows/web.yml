name: web
# Builds the browser client (web/) the way it is published and checks it:
# every vendored file against vendor.lock.json, the precompiled bytecode under
# Pyodide (web/smoke.mjs), and that two builds give the same bytes.
on:
  push:
    paths: ["web/**", "crptochat/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", "crptochat/**", ".github/workflows/web.yml"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Baixar e conferir o vendor
        run: python web/fetch_vendor.py
      - name: Dependência do build (ws, travada no package-lock)
        run: cd web && npm ci --no-audit --no-fund --ignore-scripts
      - name: Build
        run: |
          node --version
          python web/build.py
          cp web/dist/SHA256SUMS /tmp/sums-1
      - name: Smoke test do build (Pyodide no Node)
        run: node web/smoke.mjs
      - name: Build reproduzível
        run: |
          python web/build.py
          diff /tmp/sums-1 web/dist/SHA256SUMS && echo "mesmos bytes nos dois builds"
