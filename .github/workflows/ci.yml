name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      # ffmpeg: real Opus encoder and voice masking. pass + gnupg: real vault tests.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg pass gnupg
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: python -m crptochat.selftest
      # the version never goes back: against the base of a PR, and against the previous
      # commit of a push (catches e.g. a conflict resolved to the lower of two bumps)
      - name: Versão não volta atrás
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = pull_request ]; then
            ref="$BASE_REF"
          elif [ "$EVENT" = push ] && [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            ref="$BEFORE"
          else
            echo "nada para comparar"; exit 0
          fi
          git fetch --no-tags --depth=1 origin "$ref"
          python packaging/check_version.py FETCH_HEAD

  server-image-restricted:
    name: Imagem do servidor (umask 077 + restrições de produção)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Simular checkout com umask 077 (arquivos 0600)
        run: find crptochat -type f -exec chmod 600 {} +
      - name: Construir a imagem
        run: docker build -t crptochat-server:restricted .
      - name: Extrair versão e smoke com restrições
        run: |
          set -euo pipefail
          version="$(sed -n 's/^__version__ = "\([0-9][0-9.]*\)".*/\1/p' crptochat/__init__.py | head -n1)"
          test -n "$version"
          chmod +x packaging/server_smoke_restricted.sh
          packaging/server_smoke_restricted.sh crptochat-server:restricted "$version" 25
