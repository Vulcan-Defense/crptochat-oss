name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      # ffmpeg: real Opus encoder and voice masking. pass + gnupg: real vault tests.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg pass gnupg
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: python -m crptochat.selftest
